name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        guzzle: ['7', '8']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --with "guzzlehttp/guzzle:^${{ matrix.guzzle }}.0"

      - name: Unit tests
        run: composer test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lowest supported PHP version, so the dev dependencies are installed for it
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: PHPStan
        run: composer phpstan -- --no-progress

      - name: PHPStan, deprecations in the newest PHP version
        run: composer phpstan-deprecations -- --no-progress
